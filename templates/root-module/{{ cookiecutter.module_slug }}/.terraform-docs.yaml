formatter: "markdown table"
version: ""
header-from: ".header.md"

recursive:
  enabled: false

output:
  file: "README.md"
  mode: replace
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  default: true
  escape: true
  hide-empty: false
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
